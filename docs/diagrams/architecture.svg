<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <style>
      text { font-family: 'Courier New', monospace; font-size: 11px; }
      .title { font-size: 14px; font-weight: bold; }
      .subtitle { font-size: 10px; }
      .block-label { font-size: 10px; font-weight: bold; }
      .signal-label { font-size: 9px; }
      .box { fill: #f8f9fa; stroke: #2c3e50; stroke-width: 1.5; }
      .box-accent { fill: #e8f4f8; stroke: #2c3e50; stroke-width: 1.5; }
      .box-memory { fill: #f0f7e8; stroke: #2c3e50; stroke-width: 1.5; }
      .box-io { fill: #fdf2e9; stroke: #2c3e50; stroke-width: 1.5; }
      .box-scalar { fill: #e8eaf6; stroke: #2c3e50; stroke-width: 1.5; }
      .box-vector { fill: #e8f5e9; stroke: #2c3e50; stroke-width: 1.5; }
      .box-matrix { fill: #fff3e0; stroke: #2c3e50; stroke-width: 1.5; }
      .arrow { stroke: #2c3e50; stroke-width: 1.2; fill: none; marker-end: url(#arrowhead); }
      .arrow-bus { stroke: #2c3e50; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }
      .bus-line { stroke: #2c3e50; stroke-width: 1.0; fill: none; stroke-dasharray: 4,2; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2c3e50"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="25" text-anchor="middle" class="title">ENOR-CPU System Architecture</text>
  <text x="400" y="40" text-anchor="middle" class="subtitle">32-bit RISC · Vector Engine · Matrix Engine · Harvard Memory</text>

  <!-- ENOR-CPU Boundary -->
  <rect x="50" y="55" width="700" height="380" rx="4" fill="none" stroke="#2c3e50" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="60" y="70" class="block-label">ENOR-CPU</text>

  <!-- Instruction Bus -->
  <line x1="120" y1="80" x2="120" y2="95" class="arrow-bus"/>
  <text x="125" y="90" class="signal-label">32-bit inst</text>

  <!-- Program Counter -->
  <rect x="90" y="95" width="60" height="30" class="box"/>
  <text x="120" y="114" text-anchor="middle" class="block-label">PC</text>

  <!-- Instruction Fetch -->
  <line x1="120" y1="125" x2="120" y2="140" class="arrow"/>
  <rect x="80" y="140" width="80" height="30" class="box"/>
  <text x="120" y="159" text-anchor="middle" class="block-label">IF / ID</text>

  <!-- Decoder -->
  <line x1="120" y1="170" x2="120" y2="185" class="arrow"/>
  <rect x="80" y="185" width="80" height="30" class="box"/>
  <text x="120" y="204" text-anchor="middle" class="block-label">Decoder</text>

  <!-- Control Signals -->
  <line x1="120" y1="215" x2="120" y2="235" class="arrow"/>
  <text x="125" y="230" class="signal-label">ctrl</text>

  <!-- Scalar Core -->
  <rect x="50" y="235" width="140" height="180" class="box-scalar" rx="3"/>
  <text x="120" y="252" text-anchor="middle" class="block-label">Scalar Core</text>

  <!-- Scalar Register File -->
  <rect x="65" y="260" width="110" height="35" class="box-accent"/>
  <text x="120" y="277" text-anchor="middle" class="block-label">Register File</text>
  <text x="120" y="289" text-anchor="middle" class="subtitle">32 × 32-bit</text>

  <!-- ALU -->
  <rect x="65" y="305" width="110" height="35" class="box-accent"/>
  <text x="120" y="322" text-anchor="middle" class="block-label">ALU</text>
  <text x="120" y="334" text-anchor="middle" class="subtitle">ADD SUB AND OR XOR</text>

  <!-- Load/Store Unit -->
  <rect x="65" y="350" width="110" height="35" class="box-accent"/>
  <text x="120" y="367" text-anchor="middle" class="block-label">Load/Store Unit</text>
  <text x="120" y="379" text-anchor="middle" class="subtitle">Addr Calc · Alignment</text>

  <!-- Vector Engine -->
  <rect x="220" y="235" width="180" height="180" class="box-vector" rx="3"/>
  <text x="310" y="252" text-anchor="middle" class="block-label">Vector Engine</text>

  <!-- Vector Register File -->
  <rect x="235" y="260" width="150" height="35" class="box-accent"/>
  <text x="310" y="277" text-anchor="middle" class="block-label">Vector Register File</text>
  <text x="310" y="289" text-anchor="middle" class="subtitle">16 × 256-bit</text>

  <!-- Vector Lanes -->
  <rect x="235" y="305" width="150" height="35" class="box-accent"/>
  <text x="310" y="322" text-anchor="middle" class="block-label">8× Vector Lanes</text>
  <text x="310" y="334" text-anchor="middle" class="subtitle">INT8 · INT16 · INT32</text>

  <!-- Reduction Unit -->
  <rect x="235" y="350" width="150" height="35" class="box-accent"/>
  <text x="310" y="367" text-anchor="middle" class="block-label">Reduction Unit</text>
  <text x="310" y="379" text-anchor="middle" class="subtitle">DOT · SUM · MAX</text>

  <!-- Matrix Engine -->
  <rect x="430" y="235" width="180" height="180" class="box-matrix" rx="3"/>
  <text x="520" y="252" text-anchor="middle" class="block-label">Matrix Engine</text>

  <!-- MAC Array -->
  <rect x="445" y="260" width="150" height="35" class="box-accent"/>
  <text x="520" y="277" text-anchor="middle" class="block-label">8×8 MAC Array</text>
  <text x="520" y="289" text-anchor="middle" class="subtitle">64 MACs/cycle</text>

  <!-- Accumulator -->
  <rect x="445" y="305" width="150" height="35" class="box-accent"/>
  <text x="520" y="322" text-anchor="middle" class="block-label">Accumulator</text>
  <text x="520" y="334" text-anchor="middle" class="subtitle">8×8 × 32-bit</text>

  <!-- Tile Controller -->
  <rect x="445" y="350" width="150" height="35" class="box-accent"/>
  <text x="520" y="367" text-anchor="middle" class="block-label">Tile Controller</text>
  <text x="520" y="379" text-anchor="middle" class="subtitle">Tiling · Unrolling</text>

  <!-- Interconnect -->
  <line x1="190" y1="315" x2="235" y2="315" class="arrow-bus"/>
  <line x1="385" y1="315" x2="445" y2="315" class="arrow-bus"/>

  <!-- Memory System Boundary -->
  <rect x="50" y="450" width="700" height="130" rx="4" fill="none" stroke="#2c3e50" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="60" y="465" class="block-label">Memory System</text>

  <!-- Code SRAM -->
  <rect x="65" y="475" width="120" height="55" class="box-memory"/>
  <text x="125" y="497" text-anchor="middle" class="block-label">Code SRAM</text>
  <text x="125" y="512" text-anchor="middle" class="subtitle">32 KB</text>
  <text x="125" y="524" text-anchor="middle" class="subtitle">1R · 32-bit</text>

  <!-- Data SRAM -->
  <rect x="200" y="475" width="120" height="55" class="box-memory"/>
  <text x="260" y="497" text-anchor="middle" class="block-label">Data SRAM</text>
  <text x="260" y="512" text-anchor="middle" class="subtitle">64 KB</text>
  <text x="260" y="524" text-anchor="middle" class="subtitle">2R/1W · 32-bit</text>

  <!-- Matrix SRAM -->
  <rect x="335" y="475" width="120" height="55" class="box-memory"/>
  <text x="395" y="497" text-anchor="middle" class="block-label">Matrix SRAM</text>
  <text x="395" y="512" text-anchor="middle" class="subtitle">32 KB</text>
  <text x="395" y="524" text-anchor="middle" class="subtitle">2R/1W · 512-bit</text>

  <!-- Vector SRAM -->
  <rect x="470" y="475" width="120" height="55" class="box-memory"/>
  <text x="530" y="497" text-anchor="middle" class="block-label">Vector SRAM</text>
  <text x="530" y="512" text-anchor="middle" class="subtitle">16 KB</text>
  <text x="530" y="524" text-anchor="middle" class="subtitle">4-bank · 256-bit</text>

  <!-- I/O Peripherals -->
  <rect x="605" y="475" width="130" height="55" class="box-io"/>
  <text x="670" y="497" text-anchor="middle" class="block-label">I/O Peripherals</text>
  <text x="670" y="512" text-anchor="middle" class="subtitle">UART · Timer · GPIO</text>
  <text x="670" y="524" text-anchor="middle" class="subtitle">0x8000_0000</text>

  <!-- Memory Bus Connections -->
  <line x1="120" y1="385" x2="120" y2="475" class="arrow-bus"/>
  <line x1="120" y1="430" x2="120" y2="445" class="arrow-bus"/>

  <line x1="260" y1="435" x2="260" y2="475" class="arrow-bus"/>
  <line x1="395" y1="435" x2="395" y2="475" class="arrow-bus"/>
  <line x1="530" y1="435" x2="530" y2="475" class="arrow-bus"/>
  <line x1="670" y1="435" x2="670" y2="475" class="arrow-bus"/>

  <!-- External Memory Interface -->
  <line x1="400" y1="560" x2="400" y2="590" class="arrow-bus"/>
  <text x="400" y="595" text-anchor="middle" class="signal-label">External Memory (optional)</text>

  <!-- Address Bus -->
  <line x1="50" y1="445" x2="750" y2="445" class="bus-line"/>
  <text x="760" y="448" class="signal-label">32-bit addr</text>
</svg>