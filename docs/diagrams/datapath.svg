<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" width="900" height="550">
  <defs>
    <style>
      text { font-family: 'Courier New', monospace; font-size: 10px; }
      .title { font-size: 13px; font-weight: bold; }
      .subtitle { font-size: 9px; }
      .stage-label { font-size: 11px; font-weight: bold; }
      .block-label { font-size: 9px; font-weight: bold; }
      .signal-label { font-size: 8px; }
      .box { fill: #f8f9fa; stroke: #2c3e50; stroke-width: 1.2; }
      .box-stage { fill: #e8eaf6; stroke: #2c3e50; stroke-width: 1.2; }
      .box-execute { fill: #e8f5e9; stroke: #2c3e50; stroke-width: 1.2; }
      .box-memory { fill: #fff3e0; stroke: #2c3e50; stroke-width: 1.2; }
      .box-writeback { fill: #fce4ec; stroke: #2c3e50; stroke-width: 1.2; }
      .arrow { stroke: #2c3e50; stroke-width: 1.0; fill: none; marker-end: url(#arrowhead); }
      .arrow-bus { stroke: #2c3e50; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }
      .pipeline-reg { fill: #ffcdd2; stroke: #2c3e50; stroke-width: 1.0; }
      .mux { fill: #f3e5f5; stroke: #2c3e50; stroke-width: 1.0; }
    </style>
    <marker id="arrowhead" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#2c3e50"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="450" y="20" text-anchor="middle" class="title">ENOR-CPU Datapath</text>
  <text x="450" y="33" text-anchor="middle" class="subtitle">5-Stage In-Order Pipeline · Single-Issue · Harvard Memory</text>

  <!-- Stage Labels -->
  <text x="90" y="55" text-anchor="middle" class="stage-label">IF</text>
  <text x="230" y="55" text-anchor="middle" class="stage-label">ID</text>
  <text x="420" y="55" text-anchor="middle" class="stage-label">EX</text>
  <text x="620" y="55" text-anchor="middle" class="stage-label">MEM</text>
  <text x="800" y="55" text-anchor="middle" class="stage-label">WB</text>

  <!-- Stage Dividers -->
  <line x1="160" y1="45" x2="160" y2="520" stroke="#bdc3c7" stroke-width="0.8" stroke-dasharray="4,3"/>
  <line x1="330" y1="45" x2="330" y2="520" stroke="#bdc3c7" stroke-width="0.8" stroke-dasharray="4,3"/>
  <line x1="520" y1="45" x2="520" y2="520" stroke="#bdc3c7" stroke-width="0.8" stroke-dasharray="4,3"/>
  <line x1="720" y1="45" x2="720" y2="520" stroke="#bdc3c7" stroke-width="0.8" stroke-dasharray="4,3"/>

  <!-- ====== IF Stage ====== -->
  <!-- Program Counter -->
  <rect x="50" y="70" width="80" height="40" class="box"/>
  <text x="90" y="88" text-anchor="middle" class="block-label">Program</text>
  <text x="90" y="100" text-anchor="middle" class="block-label">Counter</text>

  <!-- PC+4 Adder -->
  <rect x="50" y="130" width="80" height="30" class="box"/>
  <text x="90" y="149" text-anchor="middle" class="block-label">PC + 4</text>

  <!-- Code SRAM -->
  <rect x="50" y="180" width="80" height="45" class="box-stage"/>
  <text x="90" y="200" text-anchor="middle" class="block-label">Code SRAM</text>
  <text x="90" y="213" text-anchor="middle" class="subtitle">32 KB</text>

  <!-- Fetch Buffer -->
  <rect x="50" y="250" width="80" height="35" class="pipeline-reg"/>
  <text x="90" y="267" text-anchor="middle" class="block-label">IF/ID</text>
  <text x="90" y="279" text-anchor="middle" class="subtitle">Pipeline Reg</text>

  <!-- IF Connections -->
  <line x1="90" y1="110" x2="90" y2="130" class="arrow"/>
  <line x1="90" y1="160" x2="90" y2="180" class="arrow"/>
  <line x1="90" y1="225" x2="90" y2="250" class="arrow"/>
  <line x1="90" y1="285" x2="90" y2="300" class="arrow"/>

  <!-- ====== ID Stage ====== -->
  <!-- Instruction Decoder -->
  <rect x="180" y="70" width="100" height="50" class="box-stage"/>
  <text x="230" y="92" text-anchor="middle" class="block-label">Instruction</text>
  <text x="230" y="105" text-anchor="middle" class="block-label">Decoder</text>

  <!-- Control Unit -->
  <rect x="180" y="140" width="100" height="40" class="box-stage"/>
  <text x="230" y="157" text-anchor="middle" class="block-label">Control</text>
  <text x="230" y="169" text-anchor="middle" class="block-label">Signals</text>

  <!-- Register File -->
  <rect x="180" y="200" width="100" height="55" class="box-stage"/>
  <text x="230" y="222" text-anchor="middle" class="block-label">Register File</text>
  <text x="230" y="234" text-anchor="middle" class="subtitle">32 × 32-bit</text>
  <text x="230" y="246" text-anchor="middle" class="subtitle">2R / 1W</text>

  <!-- Immediate Gen -->
  <rect x="180" y="275" width="100" height="35" class="box-stage"/>
  <text x="230" y="292" text-anchor="middle" class="block-label">Immediate</text>
  <text x="230" y="302" text-anchor="middle" class="block-label">Generator</text>

  <!-- Vector Register File -->
  <rect x="180" y="330" width="100" height="55" class="box-stage" fill="#e8f5e9"/>
  <text x="230" y="352" text-anchor="middle" class="block-label">Vector RegFile</text>
  <text x="230" y="364" text-anchor="middle" class="subtitle">16 × 256-bit</text>
  <text x="230" y="376" text-anchor="middle" class="subtitle">2R / 1W</text>

  <!-- ID/EX Pipeline Register -->
  <rect x="180" y="410" width="100" height="35" class="pipeline-reg"/>
  <text x="230" y="427" text-anchor="middle" class="block-label">ID/EX</text>
  <text x="230" y="439" text-anchor="middle" class="subtitle">Pipeline Reg</text>

  <!-- ID Connections -->
  <line x1="230" y1="120" x2="230" y2="140" class="arrow"/>
  <line x1="230" y1="180" x2="230" y2="200" class="arrow"/>
  <line x1="230" y1="255" x2="230" y2="275" class="arrow"/>
  <line x1="230" y1="310" x2="230" y2="330" class="arrow"/>
  <line x1="230" y1="385" x2="230" y2="410" class="arrow"/>

  <!-- ====== EX Stage ====== -->
  <!-- Source Mux -->
  <rect x="360" y="70" width="80" height="35" class="mux"/>
  <text x="400" y="87" text-anchor="middle" class="block-label">Src Mux</text>
  <text x="400" y="98" text-anchor="middle" class="subtitle">Reg/Imm</text>

  <!-- Scalar ALU -->
  <rect x="360" y="130" width="80" height="50" class="box-execute"/>
  <text x="400" y="152" text-anchor="middle" class="block-label">Scalar ALU</text>
  <text x="400" y="164" text-anchor="middle" class="subtitle">32-bit</text>
  <text x="400" y="174" text-anchor="middle" class="subtitle">ADD SUB AND OR</text>

  <!-- Branch Logic -->
  <rect x="360" y="200" width="80" height="35" class="box-execute"/>
  <text x="400" y="217" text-anchor="middle" class="block-label">Branch Logic</text>
  <text x="400" y="228" text-anchor="middle" class="subtitle">Condition · Target</text>

  <!-- Vector Unit -->
  <rect x="360" y="260" width="80" height="60" class="box-execute" fill="#c8e6c9"/>
  <text x="400" y="280" text-anchor="middle" class="block-label">Vector Unit</text>
  <text x="400" y="292" text-anchor="middle" class="subtitle">8× Lanes</text>
  <text x="400" y="304" text-anchor="middle" class="subtitle">256-bit SIMD</text>

  <!-- Matrix Unit -->
  <rect x="360" y="340" width="80" height="60" class="box-execute" fill="#ffe0b2"/>
  <text x="400" y="360" text-anchor="middle" class="block-label">Matrix Unit</text>
  <text x="400" y="372" text-anchor="middle" class="subtitle">8×8 MAC</text>
  <text x="400" y="384" text-anchor="middle" class="subtitle">64 MACs/cycle</text>

  <!-- EX/MEM Pipeline Register -->
  <rect x="360" y="410" width="80" height="35" class="pipeline-reg"/>
  <text x="400" y="427" text-anchor="middle" class="block-label">EX/MEM</text>
  <text x="400" y="439" text-anchor="middle" class="subtitle">Pipeline Reg</text>

  <!-- EX Connections -->
  <line x1="400" y1="105" x2="400" y2="130" class="arrow"/>
  <line x1="400" y1="180" x2="400" y2="200" class="arrow"/>
  <line x1="400" y1="235" x2="400" y2="260" class="arrow"/>
  <line x1="400" y1="320" x2="400" y2="340" class="arrow"/>
  <line x1="400" y1="400" x2="400" y2="410" class="arrow"/>

  <!-- ====== MEM Stage ====== -->
  <!-- Data SRAM -->
  <rect x="560" y="70" width="100" height="55" class="box-memory"/>
  <text x="610" y="92" text-anchor="middle" class="block-label">Data SRAM</text>
  <text x="610" y="104" text-anchor="middle" class="subtitle">64 KB</text>
  <text x="610" y="116" text-anchor="middle" class="subtitle">2R/1W</text>

  <!-- Vector SRAM -->
  <rect x="560" y="145" width="100" height="55" class="box-memory" fill="#c8e6c9"/>
  <text x="610" y="167" text-anchor="middle" class="block-label">Vector SRAM</text>
  <text x="610" y="179" text-anchor="middle" class="subtitle">16 KB</text>
  <text x="610" y="191" text-anchor="middle" class="subtitle">4-bank</text>

  <!-- Matrix SRAM -->
  <rect x="560" y="220" width="100" height="55" class="box-memory" fill="#ffe0b2"/>
  <text x="610" y="242" text-anchor="middle" class="block-label">Matrix SRAM</text>
  <text x="610" y="254" text-anchor="middle" class="subtitle">32 KB</text>
  <text x="610" y="266" text-anchor="middle" class="subtitle">Dual-port</text>

  <!-- Address Calculation -->
  <rect x="560" y="300" width="100" height="35" class="box-memory"/>
  <text x="610" y="317" text-anchor="middle" class="block-label">Address Calc</text>
  <text x="610" y="328" text-anchor="middle" class="subtitle">Base + Offset</text>

  <!-- MEM/WB Pipeline Register -->
  <rect x="560" y="410" width="100" height="35" class="pipeline-reg"/>
  <text x="610" y="427" text-anchor="middle" class="block-label">MEM/WB</text>
  <text x="610" y="439" text-anchor="middle" class="subtitle">Pipeline Reg</text>

  <!-- MEM Connections -->
  <line x1="610" y1="125" x2="610" y2="145" class="arrow"/>
  <line x1="610" y1="200" x2="610" y2="220" class="arrow"/>
  <line x1="610" y1="275" x2="610" y2="300" class="arrow"/>
  <line x1="610" y1="335" x2="610" y2="410" class="arrow"/>

  <!-- ====== WB Stage ====== -->
  <!-- WB Mux -->
  <rect x="760" y="70" width="80" height="35" class="mux"/>
  <text x="800" y="87" text-anchor="middle" class="block-label">WB Mux</text>
  <text x="800" y="98" text-anchor="middle" class="subtitle">ALU/Mem</text>

  <!-- Register Write -->
  <rect x="760" y="130" width="80" height="45" class="box-writeback"/>
  <text x="800" y="150" text-anchor="middle" class="block-label">Register</text>
  <text x="800" y="162" text-anchor="middle" class="block-label">Write</text>

  <!-- Vector Write -->
  <rect x="760" y="200" width="80" height="45" class="box-writeback" fill="#c8e6c9"/>
  <text x="800" y="220" text-anchor="middle" class="block-label">Vector</text>
  <text x="800" y="232" text-anchor="middle" class="block-label">Write</text>

  <!-- Writeback Data -->
  <rect x="760" y="275" width="80" height="35" class="box-writeback"/>
  <text x="800" y="292" text-anchor="middle" class="block-label">Result Mux</text>
  <text x="800" y="302" text-anchor="middle" class="subtitle">ALU/Load/Vect</text>

  <!-- Forwarding Unit -->
  <rect x="760" y="340" width="80" height="45" class="box-writeback"/>
  <text x="800" y="357" text-anchor="middle" class="block-label">Forwarding</text>
  <text x="800" y="369" text-anchor="middle" class="block-label">Unit</text>
  <text x="800" y="380" text-anchor="middle" class="subtitle">EX→EX MEM→EX</text>

  <!-- WB Connections -->
  <line x1="800" y1="105" x2="800" y2="130" class="arrow"/>
  <line x1="800" y1="175" x2="800" y2="200" class="arrow"/>
  <line x1="800" y1="245" x2="800" y2="275" class="arrow"/>
  <line x1="800" y1="310" x2="800" y2="340" class="arrow"/>

  <!-- Forwarding paths (dashed) -->
  <path d="M 840 360 Q 870 360 870 200 Q 870 90 800 90" stroke="#e74c3c" stroke-width="0.8" fill="none" stroke-dasharray="3,2" marker-end="url(#arrowhead)"/>
  <path d="M 840 360 Q 860 360 860 250 Q 860 170 800 170" stroke="#e74c3c" stroke-width="0.8" fill="none" stroke-dasharray="3,2"/>

  <!-- Writeback to Register File path -->
  <path d="M 760 150 L 280 150 L 280 200" stroke="#9c27b0" stroke-width="1.0" fill="none" stroke-dasharray="4,2" marker-end="url(#arrowhead)"/>

  <!-- Data Bus -->
  <line x1="160" y1="460" x2="720" y2="460" stroke="#2c3e50" stroke-width="1.2" fill="none"/>
  <text x="440" y="475" text-anchor="middle" class="signal-label">Data Bus</text>

  <!-- Memory connections to bus -->
  <line x1="610" y1="125" x2="610" y2="460" stroke="#2c3e50" stroke-width="0.8" fill="none" stroke-dasharray="3,2"/>
  <line x1="260" y1="255" x2="260" y2="460" stroke="#2c3e50" stroke-width="0.8" fill="none" stroke-dasharray="3,2"/>

  <!-- Legend -->
  <rect x="50" y="490" width="800" height="50" fill="#fafafa" stroke="#bdc3c7" stroke-width="0.8"/>
  <text x="60" y="505" class="block-label">Legend:</text>
  <rect x="120" y="497" width="15" height="10" fill="#e8eaf6" stroke="#2c3e50" stroke-width="0.8"/>
  <text x="140" y="506" class="subtitle">IF/ID Stage</text>
  <rect x="220" y="497" width="15" height="10" fill="#e8f5e9" stroke="#2c3e50" stroke-width="0.8"/>
  <text x="240" y="506" class="subtitle">EX Stage</text>
  <rect x="310" y="497" width="15" height="10" fill="#fff3e0" stroke="#2c3e50" stroke-width="0.8"/>
  <text x="330" y="506" class="subtitle">MEM Stage</text>
  <rect x="410" y="497" width="15" height="10" fill="#fce4ec" stroke="#2c3e50" stroke-width="0.8"/>
  <text x="430" y="506" class="subtitle">WB Stage</text>
  <rect x="510" y="497" width="15" height="10" fill="#ffcdd2" stroke="#2c3e50" stroke-width="0.8"/>
  <text x="530" y="506" class="subtitle">Pipeline Reg</text>
  <rect x="630" y="497" width="15" height="10" fill="#f3e5f5" stroke="#2c3e50" stroke-width="0.8"/>
  <text x="650" y="506" class="subtitle">Mux</text>
  <line x1="720" y1="502" x2="750" y2="502" stroke="#e74c3c" stroke-width="0.8" stroke-dasharray="3,2"/>
  <text x="755" y="506" class="subtitle">Forwarding</text>
</svg>